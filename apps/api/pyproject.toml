[project]
name = "morphia-api"
version = "0.1.0"
description = "MORPHIA cybersecurity research orchestration API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["E501", "S101"]  # line wrapping and test asserts are handled separately

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]  # FastAPI dependencies use callable defaults by design
"app/middleware/rbac.py" = ["B008"]
"app/seed.py" = ["T201"]  # CLI progress output is intentional
"tests/*.py" = ["S105", "S108"]  # test-only credentials and disposable test resources

[tool.mypy]
python_version = "3.11"
strict = true
# JSON payloads are intentionally schemaless at provider/evidence boundaries.
disable_error_code = ["type-arg"]
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
