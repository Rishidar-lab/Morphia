services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: morphia
      POSTGRES_PASSWORD: morphia_dev
      POSTGRES_DB: morphia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morphia"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://morphia:morphia_dev@postgres:5432/morphia
      DATABASE_URL_SYNC: postgresql://morphia:morphia_dev@postgres:5432/morphia
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p=[f for f in os.listdir('/proc') if f.isdigit()]; sys.exit(0 if any('app.main' in open(f'/proc/{x}/cmdline').read() for x in p) else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  # Synthetic, self-contained target for the canonical local demo.
  # Not a real application — see apps/demo-target/server.py.
  demo-target:
    build:
      context: .
      dockerfile: infra/docker/demo-target.Dockerfile
    ports:
      - "9000:9000"

volumes:
  pgdata:
