name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip 'setuptools>=83.0.0' 'wheel>=0.46.2'
      - name: Install backend dependencies
        run: python -m pip install -e 'apps/api[dev]' -e 'apps/worker[dev]'
      - name: Ruff lint
        run: python -m ruff check apps/api apps/worker
      - name: Ruff format check
        run: python -m ruff format --check apps/api apps/worker
      - name: Mypy type check
        run: cd apps/api && python -m mypy app/
      - name: API tests
        run: python -m pytest apps/api/tests -q
      - name: Worker tests
        run: python -m pytest apps/worker/tests -q
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit

  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: npm dependency audit
        run: npm audit --audit-level=high

  compose:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build application images
        run: docker compose build

  integration:
    name: Service-backed integration (journey + scope proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate a local-only .env
        run: |
          python3 - <<'PY'
          import secrets, pathlib
          p = pathlib.Path(".env"); t = pathlib.Path(".env.example").read_text()
          t = t.replace("SECRET_KEY=change-me-to-a-random-64-char-string", f"SECRET_KEY={secrets.token_urlsafe(48)}")
          t = t.replace("WORKER_AUTH_SECRET=change-me-to-a-random-secret", f"WORKER_AUTH_SECRET={secrets.token_urlsafe(32)}")
          t += f"\nSEED_ADMIN_EMAIL=admin@morphia.example.com\nSEED_ADMIN_PASSWORD={secrets.token_urlsafe(18)}\nAUTH_RATE_LIMIT=100000/minute\n"
          p.write_text(t)
          PY
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/ready | grep -q '"status":"ready"' && exit 0
            sleep 2
          done
          docker compose logs --tail 50; exit 1
      - name: Migrate + seed
        run: |
          docker compose exec -T -w /app/apps/api api alembic upgrade head
          docker compose exec -T api python -m app.seed
      - name: Live journey + scope-enforcement proof
        run: ./scripts/demo.sh --journey
      - name: Scope-enforcement unit proof
        run: docker compose exec -T -w /app/apps/api -e DATABASE_URL= -e DATABASE_URL_SYNC= api python -m pytest tests/test_scope_enforcement.py -q
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

  e2e:
    name: Playwright E2E (live stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate a local-only .env
        run: |
          python3 - <<'PY'
          import secrets, pathlib
          p = pathlib.Path(".env"); t = pathlib.Path(".env.example").read_text()
          t = t.replace("SECRET_KEY=change-me-to-a-random-64-char-string", f"SECRET_KEY={secrets.token_urlsafe(48)}")
          t = t.replace("WORKER_AUTH_SECRET=change-me-to-a-random-secret", f"WORKER_AUTH_SECRET={secrets.token_urlsafe(32)}")
          t += f"\nSEED_ADMIN_EMAIL=admin@morphia.example.com\nSEED_ADMIN_PASSWORD={secrets.token_urlsafe(18)}\nAUTH_RATE_LIMIT=100000/minute\n"
          p.write_text(t)
          PY
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for web + api + worker
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/ready | grep -q ready \
              && curl -fsS -o /dev/null http://localhost:5173 \
              && docker compose logs worker 2>&1 | grep -q "worker.started" \
              && exit 0
            sleep 2
          done
          docker compose logs --tail 80; exit 1
      - name: Migrate + seed
        run: |
          docker compose exec -T -w /app/apps/api api alembic upgrade head
          docker compose exec -T api python -m app.seed
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the MVP-journey suite
        working-directory: tests/e2e
        run: npx playwright test mvp-journey
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
